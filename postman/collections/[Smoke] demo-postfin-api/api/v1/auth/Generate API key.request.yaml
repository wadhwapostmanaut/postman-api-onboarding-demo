type: http
name: Generate API key
url: '{{baseUrl}}/api/v1/auth'
method: GET
headers:
  - key: Accept
    value: application/json
auth:
  type: basic
  credentials:
    - key: username
      value: '{{basicAuthUsername}}'
      type: string
    - key: password
      value: '{{basicAuthPassword}}'
      type: string
scripts:
  - type: afterResponse
    code:
      - // [Smoke] Auto-generated test assertions
      - pm.test('Status code is successful (2xx)', function () {
      - '    pm.response.to.be.success;'
      - '});'
      - pm.test('Response time is acceptable', function () {
      - '    var threshold = parseInt(pm.environment.get(''RESPONSE_TIME_THRESHOLD'') || ''2000'', 10);'
      - '    pm.expect(pm.response.responseTime).to.be.below(threshold);'
      - '});'
      - pm.test('Response body is not empty', function () {
      - '    if (pm.response.code !== 204) {'
      - '        var body = pm.response.text();'
      - '        pm.expect(body.length).to.be.above(0);'
      - '    }'
      - '});'
    language: text/javascript
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "apiKey": "123456789"
          }
      headers:
        - key: Content-Type
          value: application/json
        - key: X-RateLimit-Limit
          value: '300'
          description: The maximum number of requests permitted per minute
          disabled: false
        - key: X-RateLimit-Remaining
          value: '300'
          description: The number of requests remaining in the current rate limit window
          disabled: false
        - key: X-RateLimit-Reset
          value: '300'
          description: The time at which the current rate limit window resets (UTC epoch seconds)
          disabled: false
    name: Successful API key generation
  - response:
      statusCode: 401
      statusText: Unauthorized
      body:
        type: json
        content: |-
          {
            "error": {
              "name": "authenticationError",
              "message": "API key is required. Please provide an API key in the x-api-key header."
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Authentication required or API key invalid
  - response:
      statusCode: 429
      statusText: Too Many Requests
      body:
        type: json
        content: |-
          {
            "error": {
              "name": "rateLimitExceeded",
              "message": "Too many requests. Maximum 300 requests per minute allowed."
            }
          }
      headers:
        - key: Content-Type
          value: application/json
        - key: X-RateLimit-Limit
          value: '300'
          description: The maximum number of requests permitted per minute
          disabled: false
        - key: X-RateLimit-Remaining
          value: '300'
          description: The number of requests remaining in the current rate limit window
          disabled: false
        - key: X-RateLimit-Reset
          value: '300'
          description: The time at which the current rate limit window resets (UTC epoch seconds)
          disabled: false
    name: Too many requests - rate limit exceeded
  - response:
      statusCode: 500
      statusText: Internal Server Error
      body:
        type: json
        content: |-
          {
            "error": {
              "name": "serverError",
              "message": "An unexpected error occurred"
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Internal server error
