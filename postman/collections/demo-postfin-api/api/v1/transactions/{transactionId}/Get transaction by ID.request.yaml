type: http
name: Get transaction by ID
url: '{{baseUrl}}/api/v1/transactions/:transactionId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: transactionId
    value: '1'
    description: The unique identifier of the transaction
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "transaction": {
              "transactionId": "1",
              "createdAt": "2024-01-10",
              "amount": 10000,
              "currency": "POST_COINS",
              "accountId": "123",
              "transactionType": "DEPOSIT"
            }
          }
      headers:
        - key: Content-Type
          value: application/json
        - key: X-RateLimit-Limit
          value: '300'
          description: The maximum number of requests permitted per minute
          disabled: false
        - key: X-RateLimit-Remaining
          value: '300'
          description: The number of requests remaining in the current rate limit window
          disabled: false
        - key: X-RateLimit-Reset
          value: '300'
          description: The time at which the current rate limit window resets (UTC epoch seconds)
          disabled: false
    name: Transaction details retrieved successfully
  - response:
      statusCode: 401
      statusText: Unauthorized
      body:
        type: json
        content: |-
          {
            "error": {
              "name": "authenticationError",
              "message": "API key is required. Please provide an API key in the x-api-key header."
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Authentication required or API key invalid
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: json
        content: |-
          {
            "error": {
              "name": "instanceNotFoundError",
              "message": "The specified transaction does not exist."
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: The specified transaction does not exist
  - response:
      statusCode: 429
      statusText: Too Many Requests
      body:
        type: json
        content: |-
          {
            "error": {
              "name": "rateLimitExceeded",
              "message": "Too many requests. Maximum 300 requests per minute allowed."
            }
          }
      headers:
        - key: Content-Type
          value: application/json
        - key: X-RateLimit-Limit
          value: '300'
          description: The maximum number of requests permitted per minute
          disabled: false
        - key: X-RateLimit-Remaining
          value: '300'
          description: The number of requests remaining in the current rate limit window
          disabled: false
        - key: X-RateLimit-Reset
          value: '300'
          description: The time at which the current rate limit window resets (UTC epoch seconds)
          disabled: false
    name: Too many requests - rate limit exceeded
  - response:
      statusCode: 500
      statusText: Internal Server Error
      body:
        type: json
        content: |-
          {
            "error": {
              "name": "serverError",
              "message": "An unexpected error occurred"
            }
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Internal server error
